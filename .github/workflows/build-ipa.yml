name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct IPA URL or a shared Google Drive file link (decrypted Spotify IPA)"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        shell: bash
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p ipa

          # Google Drive links usually return an HTML confirmation page to curl.
          if [[ "$IPA_URL" =~ ^https://(drive|docs)\.google\.com/ ]]; then
            python3 -m pip install --break-system-packages gdown
            DRIVE_ID="$(python3 - <<'PYDRIVE'
          import os, re
          from urllib.parse import urlparse, parse_qs
          url = os.environ['IPA_URL']
          parsed = urlparse(url)
          match = re.search(r'/file/d/([A-Za-z0-9_-]+)', parsed.path)
          file_id = match.group(1) if match else parse_qs(parsed.query).get('id', [''])[0]
          if not file_id or not re.fullmatch(r'[A-Za-z0-9_-]+', file_id):
              raise SystemExit('::error::Could not extract a Google Drive file ID from the supplied URL')
          print(file_id)
          PYDRIVE
            )"
            python3 -m gdown "$DRIVE_ID" -O ipa/spotify.ipa
          else
            curl --fail --location --show-error --silent \
              --retry 3 --connect-timeout 30 \
              "$IPA_URL" --output ipa/spotify.ipa
          fi

          # A downloaded HTML/error page must not be mistaken for an IPA.
          python3 - <<'PYVERIFY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import sys

          path = Path('ipa/spotify.ipa')
          try:
              with ZipFile(path) as archive:
                  names = archive.namelist()
                  app_plists = [name for name in names
                                if name.startswith('Payload/')
                                and name.count('/') == 2
                                and name.endswith('.app/Info.plist')]
                  if not app_plists:
                      raise ValueError('Missing Payload/<App>.app/Info.plist')
                  bad_member = archive.testzip()
                  if bad_member:
                      raise ValueError(f'Corrupt archive member: {bad_member}')
          except (BadZipFile, ValueError, OSError) as exc:
              print(f'::error::Downloaded file is not a valid IPA: {exc}', file=sys.stderr)
              print('Check Google Drive sharing: Anyone with the link -> Viewer.', file=sys.stderr)
              sys.exit(1)
          print(f'IPA validated: {path.stat().st_size:,} bytes; {app_plists[0]}')
          PYVERIFY

      - run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
